name: 🔐 Semgrep

on:
    push:
        branches:
            - main
            - dev
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    actions: read
    contents: read
    security-events: write

jobs:
    semgrep:
        if: github.repository == 'dream-num/univer' || github.repository == 'jaimalkiewicz1999-art/univer'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Install Semgrep
              id: install-semgrep
              continue-on-error: true
              run: python -m pip install --upgrade pip semgrep

            - name: Test Semgrep workflow failure handling
              if: ${{ steps.install-semgrep.outcome == 'success' }}
              run: python .github/scripts/test_semgrep_workflow.py

            - name: Run Semgrep
              id: semgrep
              if: ${{ always() }}
              shell: bash
              env:
                  INSTALL_OUTCOME: ${{ steps.install-semgrep.outcome }}
              run: |
                  mkdir -p reports

                  if [ "$INSTALL_OUTCOME" = "success" ]; then
                    set +e
                    semgrep scan \
                      --config auto \
                      --sarif \
                      --output reports/semgrep.sarif
                    exit_code=$?
                    set -e
                  else
                    exit_code=2
                  fi

                  if [ ! -s reports/semgrep.sarif ]; then
                    # A successful exit without a report is still a scan failure.
                    if [ "$exit_code" -eq 0 ]; then
                      exit_code=2
                    fi
                    printf '%s\n' \
                      '{' \
                      '  "version": "2.1.0",' \
                      '  "$schema": "https://json.schemastore.org/sarif-2.1.0.json",' \
                      '  "runs": [' \
                      '    {' \
                      '      "tool": {' \
                      '        "driver": {' \
                      '          "name": "Semgrep",' \
                      '          "informationUri": "https://semgrep.dev"' \
                      '        }' \
                      '      },' \
                      '      "invocations": [' \
                      '        {' \
                      '          "executionSuccessful": false,' \
                      '          "toolExecutionNotifications": [' \
                      '            {' \
                      '              "level": "error",' \
                      '              "message": {' \
                      '                "text": "Semgrep did not produce a SARIF report. Check the workflow logs for the setup or scan failure."' \
                      '              }' \
                      '            }' \
                      '          ]' \
                      '        }' \
                      '      ],' \
                      '      "results": []' \
                      '    }' \
                      '  ]' \
                      '}' > reports/semgrep.sarif
                  fi

                  echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

            - name: Upload Semgrep SARIF to GitHub
              id: upload-sarif
              if: ${{ always() }}
              continue-on-error: true
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: reports/semgrep.sarif
                  category: semgrep

            - name: Upload Semgrep report artifact
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: semgrep-sarif-${{ github.run_id }}
                  path: reports/semgrep.sarif
                  if-no-files-found: error
                  retention-days: 14

            - name: Summarize Semgrep report
              if: ${{ always() }}
              shell: bash
              env:
                  SEMGREP_EXIT_CODE: ${{ steps.semgrep.outputs.exit_code }}
                  INSTALL_OUTCOME: ${{ steps.install-semgrep.outcome }}
                  SARIF_UPLOAD_OUTCOME: ${{ steps.upload-sarif.outcome }}
              run: |
                  python .github/scripts/semgrep_sarif.py summary --artifact "semgrep-sarif-${{ github.run_id }}"

            - name: Fail on Semgrep error findings or execution errors
              if: ${{ always() }}
              shell: bash
              env:
                  SEMGREP_EXIT_CODE: ${{ steps.semgrep.outputs.exit_code }}
              run: |
                  if [ -z "$SEMGREP_EXIT_CODE" ]; then
                    echo "Semgrep exit code is missing."
                    exit 2
                  fi

                  if [ "$SEMGREP_EXIT_CODE" -ne 0 ]; then
                    echo "Semgrep execution failed."
                    echo "See the uploaded SARIF artifact for details."
                    exit "$SEMGREP_EXIT_CODE"
                  fi

                  python .github/scripts/semgrep_sarif.py gate
