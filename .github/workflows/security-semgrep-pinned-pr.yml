name: Semgrep pinned PR verification

on:
    pull_request:
        branches: [dev]
        types: [opened, synchronize, reopened]

permissions:
    contents: read

concurrency:
    group: semgrep-pinned-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    pinned-scan:
        if: github.repository == 'jaimalkiewicz1999-art/univer' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Checkout exact PR source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - name: Setup Python
              id: python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.12'

            - name: Install pinned scanner and serializer
              id: install
              run: python -m pip install --disable-pip-version-check semgrep==1.186.0 PyYAML==6.0.3

            - name: Test shared gate and supplemental wrapper
              id: tests
              run: |
                  python .github/scripts/test_semgrep_workflow.py
                  python .github/scripts/test_semgrep_pinned_pr.py

            - name: Fetch pinned public rule data
              id: rules
              env:
                  GIT_TERMINAL_PROMPT: '0'
              run: |
                  rules="$RUNNER_TEMP/semgrep-public-rules"
                  git init --quiet "$rules"
                  git -C "$rules" remote add origin https://github.com/semgrep/semgrep-rules.git
                  timeout 120s git -C "$rules" -c credential.helper= -c http.extraheader= fetch --depth=1 --no-tags origin a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2
                  git -C "$rules" -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD

            - name: Run pinned scan and unchanged severity gate
              if: ${{ always() }}
              env:
                  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
                  PYTHON_OUTCOME: ${{ steps.python.outcome }}
                  INSTALL_OUTCOME: ${{ steps.install.outcome }}
                  TESTS_OUTCOME: ${{ steps.tests.outcome }}
                  RULES_OUTCOME: ${{ steps.rules.outcome }}
              run: >-
                  python .github/scripts/semgrep_pinned_pr.py
                  --rules-source "$RUNNER_TEMP/semgrep-public-rules"
                  --private-root "$RUNNER_TEMP/semgrep-pinned-private"
                  --evidence "$RUNNER_TEMP/semgrep-pinned-evidence/execution.json"

            - name: Upload sanitized execution evidence only
              if: ${{ always() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: semgrep-pinned-execution-${{ github.run_id }}
                  path: ${{ runner.temp }}/semgrep-pinned-evidence/execution.json
                  if-no-files-found: error
                  retention-days: 14
